<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi Step Form</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container py-5">
    <div class="form-container mx-auto">

      <!-- Top -->
      <div class="text-center mb-4">
        <h1 class="main-title">Create Your Profile</h1>
        <p class="sub-title">
          Multi-Step Form with Validation & Local Storage
        </p>
      </div>

      <!-- Progress -->
      <div class="progress-wrapper mb-5">

        <div class="progress-line">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="steps">

          <div class="step active">
            <div class="step-circle">1</div>
            <span>Personal</span>
          </div>

          <div class="step">
            <div class="step-circle">2</div>
            <span>Contact</span>
          </div>

          <div class="step">
            <div class="step-circle">3</div>
            <span>Account</span>
          </div>

        </div>
      </div>

      <!-- Form -->
      <form id="multiStepForm">

        <!-- STEP 1 -->
        <div class="form-step active">

          <div class="row g-4">

            <div class="col-md-6">
              <label class="form-label">First Name</label>
              <input
                type="text"
                class="form-control"
                id="firstName"
                placeholder="Enter first name"
              />
              <small class="error"></small>
            </div>

            <div class="col-md-6">
              <label class="form-label">Last Name</label>
              <input
                type="text"
                class="form-control"
                id="lastName"
                placeholder="Enter last name"
              />
              <small class="error"></small>
            </div>

          </div>

        </div>

        <!-- STEP 2 -->
        <div class="form-step">

          <div class="row g-4">

            <div class="col-md-6">
              <label class="form-label">Email Address</label>
              <input
                type="text"
                class="form-control"
                id="email"
                placeholder="Enter email"
              />
              <small class="error"></small>
            </div>

            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input
                type="text"
                class="form-control"
                id="phone"
                placeholder="Enter phone number"
              />
              <small class="error"></small>
            </div>

          </div>

        </div>

        <!-- STEP 3 -->
        <div class="form-step">

          <div class="row g-4">

            <div class="col-md-6">
              <label class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="Create username"
              />
              <small class="error"></small>
            </div>

            <div class="col-md-6">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Create password"
              />
              <small class="error"></small>
            </div>

          </div>

        </div>

        <!-- Buttons -->
        <div class="button-group mt-5">

          <button
            type="button"
            class="btn custom-btn secondary-btn"
            id="prevBtn"
          >
            Previous
          </button>

          <button
            type="button"
            class="btn custom-btn primary-btn"
            id="nextBtn"
          >
            Next
          </button>

        </div>

      </form>

    </div>
  </div>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
